# Netlify Configuration for Adrithi Media
[build]
  publish = "."

# Direct routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets (images, fonts, scripts)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
